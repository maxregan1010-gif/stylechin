services:
  - type: web
    name: stylechin-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_TEXT_MODEL
        value: "@cf/google/gemma-4-26b-a4b-it"
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/leonardo/phoenix-1.0"
